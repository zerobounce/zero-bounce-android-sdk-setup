plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.zerobounce.minsdkconsumer'
    compileSdk = providers.gradleProperty('consumerCompileSdk').get().toInteger()

    defaultConfig {
        applicationId = 'com.zerobounce.minsdkconsumer'
        // The minSdk the SDK publishes. Do not raise it to make this build pass.
        minSdk = providers.gradleProperty('consumerMinSdk').get().toInteger()
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.zerobounce.android:zerobouncesdk:${providers.gradleProperty('zbVersion').get()}"
}
