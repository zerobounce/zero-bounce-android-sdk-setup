// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // CodeQL supports Kotlin below 2.3.30; keep kotlin-gradle-plugin pinned here (see dependabot.yml).
    ext.kotlin_version = '2.3.21'
    repositories {
        maven { url "https://plugins.gradle.org/m2/" }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
    // AGP 9.2.1 and the Kotlin plugin bring libraries with published advisories onto the build
    // classpath (the release job runs there with the signing secrets). Raise them to patched
    // releases; drop an entry once the plugin itself ships a fixed version.
    configurations.classpath {
        resolutionStrategy {
            force 'org.bouncycastle:bcprov-jdk18on:1.87',
                    'org.jdom:jdom2:2.0.6.1',
                    'org.bitbucket.b_c:jose4j:0.9.7',
                    'com.google.guava:guava:33.8.0-jre',
                    'org.apache.commons:commons-lang3:3.22.0'
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

subprojects {
    tasks.withType(Javadoc).configureEach { enabled = false }
}

apply from: "${rootDir}/scripts/publish-root.gradle"
