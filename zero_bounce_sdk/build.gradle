import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// The Dokka Gradle plugin brings Jackson 2.15.3 (15 advisories) onto this module's plugin classpath.
// Raise it to a patched release; drop this once Dokka's plugin ships a fixed version.
buildscript {
    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group.startsWith('com.fasterxml.jackson')) {
                details.useVersion(details.requested.name == 'jackson-annotations' ? '2.22' : '2.22.4')
                details.because 'Dokka plugin dependency with published advisories'
            }
        }
    }
}

plugins {
    id 'com.android.library'
    // kotlin-android removed: AGP 9.0+ has built-in Kotlin support (https://kotl.in/gradle/agp-built-in-kotlin)
    id("org.jetbrains.dokka") version "2.2.0"
    id("org.jetbrains.dokka-javadoc") version "2.2.0"
}

ext {
    PUBLISH_GROUP_ID = 'com.zerobounce.android'
    // Only bump this when releasing; do not use for plugins/dependencies (they have their own versions).
    PUBLISH_VERSION = '3.1.0'
    PUBLISH_ARTIFACT_ID = 'zerobouncesdk'
}

android {
    compileSdk = 37
    defaultConfig {
        minSdk 21
        targetSdk 36
        // Keeps the Gson-mapped models intact in apps that minify with R8.
        consumerProguardFiles 'consumer-rules.pro'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        test {
            resources.srcDirs += ['email_file.csv']
        }
        androidTest {
            resources.srcDirs += ['email_file.csv']
        }
    }
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

    namespace = 'com.zerobounce.android'
}

dokka {
    dokkaPublications.html {
        outputDirectory.set(
                layout.buildDirectory.dir("dokka"),
        )
    }
    dokkaPublications.javadoc {
        outputDirectory.set(layout.buildDirectory.dir("dokka/javadoc"))
    }
    dokkaSourceSets.configureEach {
        // Do not create index pages for empty packages
        skipEmptyPackages = true
        skipDeprecated = false
        enableKotlinStdLibDocumentationLink = false
    }
}

// Dokka 2.2.0 resolves jackson 2.15.3, freemarker 2.3.32 and jsoup 1.16.1 for its generator, all with
// published advisories. The generator runs in the release job (centralBundle), where the signing
// secrets are present, so raise those to patched releases on every Dokka configuration. Drop an entry
// once Dokka itself ships a fixed version.
def dokkaPatched = [
        'com.fasterxml.jackson.core:jackson-databind': '2.22.4',
        'com.fasterxml.jackson.core:jackson-core'    : '2.22.4',
        'com.fasterxml.jackson.core:jackson-annotations': '2.22',
        'com.fasterxml.jackson.module:jackson-module-kotlin': '2.22.4',
        'org.freemarker:freemarker'                  : '2.3.35',
        'org.jsoup:jsoup'                            : '1.24.1',
]
configurations.matching { it.name.startsWith('dokka') }.configureEach { configuration ->
    configuration.resolutionStrategy.eachDependency { details ->
        def patched = dokkaPatched["${details.requested.group}:${details.requested.name}".toString()]
        if (patched != null) {
            details.useVersion patched
            details.because 'Dokka generator dependency with published advisories'
        }
    }
}

// The Android lint tool (lint-gradle, run by lintDebug in CI) resolves guava, bouncycastle, commons-lang3
// and httpclient releases with published advisories. Lint only analyses the sources and never ships in
// the library, but raise them anyway so the build tooling carries no known-vulnerable jars. Drop an entry
// once AGP's lint ships a fixed version.
def lintPatched = [
        'com.google.guava:guava'                  : '33.8.0-jre',
        'org.bouncycastle:bcprov-jdk18on'         : '1.87',
        'org.bouncycastle:bcpkix-jdk18on'         : '1.87',
        'org.bouncycastle:bcutil-jdk18on'         : '1.87',
        'org.apache.commons:commons-lang3'        : '3.22.0',
        'org.apache.httpcomponents:httpclient'    : '4.5.14',
]
configurations.matching { it.name.startsWith('androidLint') }.configureEach { configuration ->
    configuration.resolutionStrategy.eachDependency { details ->
        def patched = lintPatched["${details.requested.group}:${details.requested.name}".toString()]
        if (patched != null) {
            details.useVersion patched
            details.because 'Android lint tool dependency with published advisories'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    // api, not implementation: the public API takes (JsonElement?) -> Unit callbacks and
    // GsonDateDeserializer is a Gson JsonDeserializer, so a consumer needs Gson to compile.
    // OkHttp stays implementation: no public declaration uses an OkHttp type.
    api 'com.google.code.gson:gson:2.14.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.4.0'

    tasks.named('dokkaGeneratePublicationJavadoc').configure {
        dependsOn(':zero_bounce_sdk:generateReleaseRFile')
    }
}
repositories {
    mavenCentral()
}

tasks.withType(Javadoc).configureEach {
    options.addBooleanOption('Xdoclint:none', true)
}

// The opt-in live API suite. It is a unit test so it can reuse the test
// dependencies, but the default test task excludes it, so `gradle test` and CI
// never run it. Run it by hand with keys in the environment:
//
//   ZEROBOUNCE_API_KEY=... ZEROBOUNCE_WARMUP_API_KEY=... \
//     gradle :zero_bounce_sdk:liveApi -PzbLive
tasks.withType(Test).configureEach {
    if (!project.hasProperty('zbLive')) {
        exclude '**/LiveApiTest*'
    }
    environment 'ZEROBOUNCE_API_KEY', System.getenv('ZEROBOUNCE_API_KEY') ?: ''
    environment 'ZEROBOUNCE_WARMUP_API_KEY', System.getenv('ZEROBOUNCE_WARMUP_API_KEY') ?: ''
    environment 'ZEROBOUNCE_LIVE_SPEND', System.getenv('ZEROBOUNCE_LIVE_SPEND') ?: ''
    environment 'ZEROBOUNCE_LIVE_CHANGES', System.getenv('ZEROBOUNCE_LIVE_CHANGES') ?: ''
}

tasks.register('liveApi') {
    group = 'verification'
    description = 'Runs the opt-in live API suite against the real ZeroBounce API.'
    dependsOn 'testDebugUnitTest'
    doFirst {
        if (!project.hasProperty('zbLive')) {
            throw new GradleException(
                'Run it as: gradle :zero_bounce_sdk:liveApi -PzbLive ' +
                '--tests "com.zerobounce.android.LiveApiTest"')
        }
    }
}

apply from: "${rootProject.projectDir}/scripts/publish-module.gradle"