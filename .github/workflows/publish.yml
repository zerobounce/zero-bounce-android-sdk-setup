name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag to publish (e.g. v2.0.17)
        required: true

permissions:
  contents: read

jobs:
  validate-tag:
    outputs:
      tag_sha: ${{ steps.tag_sha.outputs.sha }}
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          re='^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "Error: the tag input must be a release tag such as v1.2.3."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.tag }}
          persist-credentials: false
      - name: Verify tag exists
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "Error: Tag is required."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Error: Tag '$TAG' does not exist."
            exit 1
          fi
          
      - name: Record tag commit SHA
        id: tag_sha
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: Test, release build and publish
    needs: [validate-tag]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag_sha }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Unit Test
        run: ./gradlew zero_bounce_sdk:testDebugUnitTest

      - name: Generate release build
        run: ./gradlew :zero_bounce_sdk:assembleRelease

      # Signs the artifacts and stages them into build/central-staging, then zips
      # build/central-bundle.zip. Nothing leaves the runner in this step.
      - name: Build Central Portal bundle
        run: ./gradlew centralBundle --max-workers 1
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      # Uploads to the Sonatype Central Portal, the same destination the Java SDK
      # publishes to. publishingType=AUTOMATIC matches the Java SDK's autoPublish=true,
      # so a bundle that passes validation is released without a manual step.
      - name: Publish to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -f build/central-bundle.zip ]; then
            echo "Error: build/central-bundle.zip was not produced."
            exit 1
          fi
          AUTH=$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)
          HTTP=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $AUTH" \
            --form "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=zerobouncesdk-${TAG}&publishingType=AUTOMATIC")
          echo "HTTP $HTTP"
          echo "Response: $(cat response.txt)"
          # The Portal returns 201 with a deployment id when the bundle is accepted.
          if [ "$HTTP" != "201" ]; then
            echo "Error: Central Portal rejected the upload."
            exit 1
          fi
          echo "Deployment accepted. Validation and release happen asynchronously;"
          echo "check https://central.sonatype.com/publishing/deployments if it does not appear."

  release:
    name: Create GitHub Release
    needs: [validate-tag, publish]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag_sha }}
          fetch-depth: 0

          persist-credentials: false
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
