name: SDK CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # Check for lint issues
  lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Execute unit tests.
      - name: Run unit tests
        run: ./gradlew zero_bounce_sdk:testDebugUnitTest

      # Build a debug version to test that the sdk compiles.
      - name: Generate release build
        run: ./gradlew :zero_bounce_sdk:assembleDebug
