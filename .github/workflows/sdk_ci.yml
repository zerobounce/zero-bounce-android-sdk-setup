name: SDK CI

on:
  # Started by dependabot-auto-merge.yml after it merges: a merge made with GITHUB_TOKEN
  # starts no push workflows.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # Check for lint issues
  lint:
    name: Test & Lint (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the JDK publish.yml builds the released artifacts with; keep the two in step.
        # 17 is the floor the README promises for building the SDK ("JDK 17 or newer"; AGP 9
        # needs 17) and the SDK's jvmTarget. Pin both rather than the runner image's default.
        java: [17, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      # Execute unit tests.
      - name: Run unit tests
        run: ./gradlew zero_bounce_sdk:testDebugUnitTest

      # Build a debug version to test that the sdk compiles.
      - name: Generate release build
        run: ./gradlew :zero_bounce_sdk:assembleDebug

      # The SDK declares a minSdk, but a runtime dependency with a higher one breaks
      # manifest merging for apps at that floor (appcompat 1.8.0 did, at 23). Stage the
      # publication and build a minimal app at the published minSdk against it.
      - name: Build a consumer app at the SDK's minSdk
        run: ci/check_min_sdk_consumer.sh
